name: android-termux-e2e

on:
  pull_request:
    paths:
      - .github/workflows/android-termux-e2e.yml
      - packages/slopcode/bin/slopcode
      - packages/slopcode/native/android-tui/**
      - packages/slopcode/script/android-termux-e2e.ts
      - packages/slopcode/script/build.ts
      - packages/slopcode/script/postinstall.mjs
      - packages/slopcode/script/publish.ts
      - packages/slopcode/script/verify-artifacts.ts
      - packages/slopcode/test/android-*.test.ts
      - packages/slopcode/test/bin-launcher.test.ts
  workflow_dispatch:
    inputs:
      mode:
        description: Android E2E mode
        type: choice
        default: parity
        options:
          - smoke
          - parity
  schedule:
    - cron: "27 6 * * *"

jobs:
  termux:
    name: shipped package on Termux
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.1.12297006"

      - name: Build Android packages
        run: |
          bun --cwd packages/slopcode run script/build.ts --target=android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006

      - name: Verify Android package artifacts
        run: |
          bun --cwd packages/slopcode run script/verify-artifacts.ts --android-only
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006

      - name: Run Termux package parity harness
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          SLOPCODE_ANDROID_BOOTSTRAP: "1"
          SLOPCODE_ANDROID_E2E_MODE: ${{ github.event.inputs.mode || 'parity' }}
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            curl -L -o /tmp/termux.apk https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3+github-debug_universal.apk
            adb install /tmp/termux.apk
            adb shell monkey -p com.termux 1
            sleep 8
            bun --cwd packages/slopcode run script/android-termux-e2e.ts
